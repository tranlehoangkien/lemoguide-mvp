spring:
  application:
    name: lemoguide_mvp

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lemoguide_mvp?createDatabaseIfNotExist=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: lemoguide-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000   # ms to wait for a free connection before failing
      idle-timeout: 600000        # ms an idle connection may sit in the pool
      max-lifetime: 1800000       # ms before a connection is retired (keep < MySQL wait_timeout)
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never alter or validate it.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${AVATAR_MAX_UPLOAD_SIZE:5MB}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Error response attributes. Moved out of `server.error.*` in Spring Boot 4.
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    lemonadex.lemoguide: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,http://localhost:4174}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allow-credentials: true
  upload:
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
    avatar-url-prefix: ${AVATAR_URL_PREFIX:/uploads/avatars}
    max-avatar-size-bytes: ${AVATAR_MAX_SIZE_BYTES:2097152}   # 2 MB
    cv-template-thumbnail-dir: ${CV_TEMPLATE_THUMBNAIL_UPLOAD_DIR:uploads/cv-templates}
    cv-template-thumbnail-url-prefix: ${CV_TEMPLATE_THUMBNAIL_URL_PREFIX:/uploads/cv-templates}
    max-cv-template-thumbnail-size-bytes: ${CV_TEMPLATE_THUMBNAIL_MAX_SIZE_BYTES:3145728}   # 3 MB
  jwt:
    # HS256 signing key. Must be >= 32 bytes. Override in every real environment.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  ai:
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
